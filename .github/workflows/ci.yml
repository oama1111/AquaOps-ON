name: CI

# Continuous integration for AquaOps ON.
#
# Two jobs, deliberately split by feedback speed:
#   quality    - lint, type check, and the unit/contract suite with the C6
#                coverage gate. Minutes, no simulation dependencies.
#   case-data  - rebuild the Maple Creek case network and re-run the physical
#                plausibility validator, which exits non-zero on violation.
#
# The split is the practice DORA describes: keep the fast tests fast enough to
# run on every commit, and move the slow validation to its own stage.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Everything the fast job imports, minus the simulation stack (wntr,
      # pandas, psycopg2, matplotlib) that only the case-data job needs.
      # scikit-learn pulls in scipy, so M2's second detector is covered without
      # installing the whole simulation stack. Keeping this list short is what
      # keeps the feedback loop inside a few minutes.
      # TODO(Unit 6): replace this list with a lockfile once the stack is frozen.
      - name: Install fast-job dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy pytest pytest-cov httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app modules --ignore-missing-imports

      # C6 in the frozen success criteria is "test coverage >= 70% and a
      # reproducible deployment". The pipeline enforces it so that the
      # criterion is a gate rather than an intention.
      - name: Tests with the C6 coverage gate
        env:
          # Keep Matplotlib's font cache inside the runner: a non-writable HOME
          # makes the first import rebuild it and slows the suite unpredictably.
          MPLCONFIGDIR: /tmp/mplcache
        run: pytest --cov=app --cov=modules --cov-report=term-missing --cov-fail-under=70

  case-data:
    name: Rebuild and validate the case network
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the Maple Creek case network
        run: python examples/build_maple_creek.py

      - name: Validate physical plausibility (exits non-zero on violation)
        run: python examples/validate_maple_creek.py

      - name: Upload the validation log as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: maple-creek-validation
          path: docs/evidence/
          if-no-files-found: warn

  # The deployment claim, checked by a machine rather than asserted in a report.
  #
  # Unit 6 could not build the image locally (no container runtime on the
  # development machine), so the Dockerfile and compose profile were reviewed
  # artefacts. This job closes that gap on every push to a branch: it builds the
  # image, runs the compose profile, waits for the health probe the image itself
  # declares, and then exercises the deployed system over HTTP. If the runtime
  # requirement set is ever wrong — a request path that reaches for pandas, say —
  # the container fails to start here instead of failing in front of an operator.
  container:
    name: Build the image and verify the deployed service
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aquaops-on:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the compose profile
        run: docker compose up -d

      - name: Wait for the image's own health probe to pass
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q aquaops)")
            echo "attempt ${attempt}: ${status}"
            [ "${status}" = "healthy" ] && exit 0
            sleep 3
          done
          echo "container never became healthy" >&2
          docker compose logs aquaops >&2
          exit 1

      - name: Exercise the deployed system over HTTP
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/systems/maple-creek
          curl -fsS "http://127.0.0.1:8000/api/v1/systems/maple-creek/sampling-points" \
            | python -c "import json,sys; print(len(json.load(sys.stdin)), 'sampling points')"
          # The dashboard and the generated API documentation must both be served.
          curl -fsS -o /dev/null -w "dashboard %{http_code}\n" http://127.0.0.1:8000/
          curl -fsS -o /dev/null -w "api docs  %{http_code}\n" http://127.0.0.1:8000/docs
          # The vendored asset must be served from this origin, not a CDN.
          curl -fsS -o /dev/null -w "htmx      %{http_code}\n" \
            http://127.0.0.1:8000/static/htmx.min.js

      - name: Report the image size
        run: docker image ls aquaops-on:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Show the application log if anything failed
        if: failure()
        run: docker compose logs aquaops

      - name: Stop the compose profile
        if: always()
        run: docker compose down -v
